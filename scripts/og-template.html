<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og</title>
    <style>
      @font-face {
        font-family: "Hanken Grotesk";
        src: url("/node_modules/@fontsource-variable/hanken-grotesk/files/hanken-grotesk-latin-wght-normal.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }

      :root {
        --paper: #efede8;
        --dot: #d9d6cf;
        --green: #1f4d2c;
        --orange: #e8702a;
        --ink: #2b2b29;
        --muted-ink: #5f605b;
        --line: #d9d5cc;
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 58px 72px 48px;
        background-color: var(--paper);
        background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
        background-size: 14px 14px;
        color: var(--ink);
        font-family: "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .who {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .avatar {
        width: 64px;
        height: 64px;
        border: 2px solid var(--green);
        border-radius: 50%;
        object-fit: cover;
        object-position: 50% 42%;
      }

      .who-name {
        color: var(--green);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }

      .domain {
        color: var(--muted-ink);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .name {
        margin: 0;
        color: var(--green);
        font-size: 106px;
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 1;
        text-wrap: balance;
      }

      .scribble {
        position: relative;
        display: inline-block;
        white-space: nowrap;
      }

      .scribble svg {
        position: absolute;
        left: -2%;
        bottom: -0.12em;
        width: 104%;
        height: 0.28em;
        overflow: visible;
      }

      .scribble path {
        fill: none;
        stroke: var(--orange);
        stroke-linecap: round;
      }

      .headline {
        margin: 22px 0 0;
        color: var(--muted-ink);
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.015em;
        line-height: 1.2;
      }

      .bottom {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        border-top: 1px solid var(--line);
        padding-top: 18px;
        color: var(--muted-ink);
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="who">
        <img class="avatar" src="/public/headshot_sq.webp" alt="" width="64" height="64" />
        <span class="who-name">Adam Miller</span>
      </div>
      <span class="domain">adammiller.co</span>
    </div>

    <div>
      <h1 class="name">
        Adam <span class="scribble">Miller<svg
            viewBox="0 0 300 12"
            preserveAspectRatio="none"
            aria-hidden="true"
          >
            <path d="M2 7 C 50 3, 110 9, 170 6 S 260 3, 298 6" stroke-width="2.6"></path>
            <path d="M6 9 C 70 6, 140 10, 200 8 S 270 6, 294 8" stroke-width="1.2" opacity=".55"></path>
          </svg></span>
      </h1>
      <p class="headline">Staff Software Engineer, Full-Stack &amp; Platform</p>
    </div>

    <div class="bottom">
      <span>Pittsburgh, PA · Remote</span>
      <span>Developer platforms · CI/CD · Agent tooling</span>
    </div>
  </body>
</html>
